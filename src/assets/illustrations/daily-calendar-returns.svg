<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" class="w-full h-auto">
  <defs>
    <radialGradient id="dcr-glow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dcr-card-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dcr-emerald-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dcr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dcr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="dcr-glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <rect x="20" y="20" width="480" height="340" rx="32" fill="url(#dcr-glow)"/>

  <!-- Card Backdrop Frame -->
  <rect x="30" y="30" width="460" height="320" rx="28" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dcr-shadow)"/>

  <!-- Calendar Page Graphic -->
  <g transform="translate(60, 55)" filter="url(#dcr-shadow)">
    <!-- Calendar Body -->
    <rect width="210" height="235" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Calendar Header (Navy) -->
    <path d="M 0 20 Q 0 0, 20 0 L 190 0 Q 210 0, 210 20 L 210 60 L 0 60 Z" fill="url(#dcr-card-header)"/>
    
    <!-- Calendar Binder Rings -->
    <circle cx="45" cy="12" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
    <circle cx="105" cy="12" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
    <circle cx="165" cy="12" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>

    <!-- Calendar Month Text -->
    <text x="105" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">
      365 DÍAS / AÑO
    </text>

    <!-- Calendar Large Day "24/7" -->
    <text x="105" y="132" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1">
      24/7
    </text>

    <!-- Mini Calendar Label -->
    <text x="105" y="162" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      LIQUIDACIÓN DIARIA
    </text>

    <!-- Daily check dots (Days of week) -->
    <g transform="translate(35, 185)">
      <circle cx="10" cy="10" r="10" fill="#ecfdf5"/>
      <text x="10" y="14" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">L</text>
      <circle cx="36" cy="10" r="10" fill="#ecfdf5"/>
      <text x="36" y="14" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">M</text>
      <circle cx="62" cy="10" r="10" fill="#ecfdf5"/>
      <text x="62" y="14" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">M</text>
      <circle cx="88" cy="10" r="10" fill="#ecfdf5"/>
      <text x="88" y="14" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">J</text>
      <circle cx="114" cy="10" r="10" fill="#ecfdf5"/>
      <text x="114" y="14" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">V</text>
      <circle cx="135" cy="10" r="8" fill="#10b981"/>
      <text x="135" y="13.5" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="9" text-anchor="middle">✓</text>
    </g>
  </g>

  <!-- Right Side: 24h Loop Clock & Compounding Flow -->
  <!-- 24-Hour Loop Dial -->
  <g transform="translate(360, 150)" filter="url(#dcr-shadow)">
    <!-- Dial circle -->
    <circle cx="0" cy="0" r="62" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4"/>
    
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="0" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>

    <!-- Clock Hour Pips -->
    <circle cx="0" cy="-45" r="2.5" fill="#94a3b8"/>
    <circle cx="45" cy="0" r="2.5" fill="#94a3b8"/>
    <circle cx="0" cy="45" r="2.5" fill="#94a3b8"/>
    <circle cx="-45" cy="0" r="2.5" fill="#94a3b8"/>
  </g>

  <!-- Flowing Yield Particle Arc connecting Calendar to Clock -->
  <path d="M 270 170 Q 315 120, 360 90" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  
  <!-- Floating Daily Yield Badge Top Right -->
  <g transform="translate(290, 50)" filter="url(#dcr-glow-badge)">
    <rect width="180" height="46" rx="15" fill="#059669"/>
    <circle cx="24" cy="23" r="13" fill="#ffffff"/>
    <text x="24" y="29" fill="#059669" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">⚡</text>
    <text x="46" y="20" fill="#ecfdf5" font-family="system-ui, sans-serif" font-weight="700" font-size="10">
      ABONO CADA 24 HORAS
    </text>
    <text x="46" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="13">
      Interés Diario Real
    </text>
  </g>

  <!-- Floating Formula Snippet Badge Bottom Right -->
  <g transform="translate(285, 240)" filter="url(#dcr-shadow)">
    <rect width="185" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="18" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="10">
      FÓRMULA EXACTA 2026:
    </text>
    <rect x="18" y="31" width="150" height="20" rx="6" fill="#f1f5f9"/>
    <text x="93" y="45" fill="#0f172a" font-family="monospace, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">
      (1 + E.A.)^(1/365) − 1
    </text>
  </g>

  <!-- Cascading Coins (Daily Return Reward) -->
  <g transform="translate(325, 175)">
    <ellipse cx="12" cy="16" rx="12" ry="6" fill="#b45309"/>
    <ellipse cx="12" cy="12" rx="12" ry="6" fill="url(#dcr-gold)" stroke="#fef3c7" stroke-width="1"/>
    <text x="12" y="15" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle">$</text>
  </g>
  <g transform="translate(415, 205)">
    <ellipse cx="10" cy="14" rx="10" ry="5" fill="#b45309"/>
    <ellipse cx="10" cy="11" rx="10" ry="5" fill="url(#dcr-gold)" stroke="#fef3c7" stroke-width="1"/>
    <text x="10" y="14" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="8" text-anchor="middle">$</text>
  </g>

  <!-- Sparkles -->
  <path d="M295 130 L297 134 L301 135 L297 136 L295 140 L293 136 L289 135 L293 134 Z" fill="#34d399"/>
  <path d="M470 120 L472 125 L477 127 L472 129 L470 134 L468 129 L463 127 L468 125 Z" fill="#fbbf24"/>
</svg>
