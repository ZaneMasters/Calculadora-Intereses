<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" class="w-full h-auto">
  <defs>
    <radialGradient id="tsd-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tsd-doc-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tsd-green-stamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="tsd-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="tsd-stamp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <rect x="20" y="20" width="480" height="340" rx="32" fill="url(#tsd-glow)"/>

  <!-- Card Backdrop Frame -->
  <rect x="30" y="30" width="460" height="320" rx="28" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1.5" filter="url(#tsd-shadow)"/>

  <!-- Official Document Base (Tax certificate style) -->
  <g transform="translate(60, 55)" filter="url(#tsd-shadow)">
    <!-- Document Page -->
    <rect width="220" height="235" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Header banner -->
    <path d="M 0 18 Q 0 0, 18 0 L 202 0 Q 220 0, 220 18 L 220 48 L 0 48 Z" fill="url(#tsd-doc-header)"/>
    
    <!-- Header Text -->
    <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">
      ESTATUTO TRIBUTARIO 2026
    </text>

    <!-- Document Fake Text Lines -->
    <g fill="#e2e8f0">
      <rect x="22" y="65" width="120" height="8" rx="4"/>
      <rect x="22" y="82" width="176" height="6" rx="3"/>
      <rect x="22" y="96" width="165" height="6" rx="3"/>
      <rect x="22" y="110" width="140" height="6" rx="3"/>
    </g>

    <!-- Art 879 Highlight Box: 4x1.000 Exemption -->
    <rect x="20" y="130" width="180" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="32" y="148" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="800" font-size="11">
      ART. 879: EXENCIÓN 4x1.000
    </text>
    <text x="32" y="168" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="14">
      Hasta 350 UVT / mes
    </text>

    <!-- Bottom calculation notes -->
    <text x="22" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-weight="600" font-size="10">
      Tope 2026: $18.330.550 COP
    </text>
    <text x="22" y="216" fill="#059669" font-family="system-ui, sans-serif" font-weight="700" font-size="10">
      ✓ Retiros sin gravamen financiero
    </text>

    <!-- Approved Stamp (Angled Green Seal) -->
    <g transform="translate(130, 85) rotate(-14)" filter="url(#tsd-stamp-shadow)">
      <rect width="90" height="40" rx="8" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 2"/>
      <text x="45" y="18" fill="#059669" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="0.5">
        EXENTO
      </text>
      <text x="45" y="32" fill="#059669" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">
        0% RETE
      </text>
    </g>
  </g>

  <!-- Right Side: Tax Shield & UVT Badge -->
  <!-- Floating Shield Icon -->
  <g transform="translate(365, 125)" filter="url(#tsd-stamp-shadow)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="url(#tsd-green-stamp)"/>
    <!-- Percent / Savings Icon -->
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">%</text>
  </g>

  <!-- Floating Badge Top: "UVT 2026 = $52.373 COP" -->
  <g transform="translate(290, 50)" filter="url(#tsd-shadow)">
    <rect width="180" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="11" fill="#eff6ff"/>
    <text x="24" y="27" fill="#1d4ed8" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">⚖️</text>
    <text x="44" y="19" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5">
      VALOR OFICIAL UVT
    </text>
    <text x="44" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="12">
      1 UVT = $52.373 COP
    </text>
  </g>

  <!-- Floating Badge Bottom: "Retención 7% sobre rendimientos > 0.058 UVT" -->
  <g transform="translate(290, 240)" filter="url(#tsd-shadow)">
    <rect width="180" height="58" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="29" r="12" fill="#1e293b"/>
    <text x="26" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">ℹ️</text>
    <text x="46" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5">
      RETENCIÓN EN LA FUENTE
    </text>
    <text x="46" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="13">
      7% Rendimientos
    </text>
    <text x="46" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="8.5">
      Aplica sobre &gt; $3.038 COP/día
    </text>
  </g>

  <!-- Sparkles -->
  <path d="M315 145 L317 149 L321 150 L317 151 L315 155 L313 151 L309 150 L313 149 Z" fill="#34d399"/>
  <path d="M465 170 L467 174 L471 175 L467 176 L465 180 L463 176 L459 175 L463 174 Z" fill="#38bdf8"/>
</svg>
