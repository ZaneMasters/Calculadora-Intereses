<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" class="w-full h-auto">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="cig-glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cig-chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="cig-stroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cig-bar-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cig-bar-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cig-coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cig-coin-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <filter id="cig-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
    <filter id="cig-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="20" y="20" width="480" height="340" rx="32" fill="url(#cig-glow)"/>

  <!-- Card Backdrop Frame -->
  <rect x="30" y="30" width="460" height="320" rx="28" fill="#ffffff" fill-opacity="0.85" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cig-card-shadow)"/>

  <!-- Decorative Graph Grid Lines -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6">
    <line x1="60" y1="90" x2="450" y2="90"/>
    <line x1="60" y1="150" x2="450" y2="150"/>
    <line x1="60" y1="210" x2="450" y2="210"/>
    <line x1="60" y1="270" x2="450" y2="270"/>
  </g>

  <!-- Background Growth Bars (Staggered progression) -->
  <rect x="80" y="235" width="28" height="45" rx="6" fill="url(#cig-bar-grad-2)"/>
  <rect x="145" y="210" width="28" height="70" rx="6" fill="url(#cig-bar-grad-2)"/>
  <rect x="210" y="175" width="28" height="105" rx="6" fill="url(#cig-bar-grad-1)"/>
  <rect x="275" y="140" width="28" height="140" rx="6" fill="url(#cig-bar-grad-1)"/>
  <rect x="340" y="95" width="28" height="185" rx="6" fill="url(#cig-bar-grad-1)"/>
  <rect x="405" y="55" width="28" height="225" rx="6" fill="url(#cig-bar-grad-1)" filter="url(#cig-shadow)"/>

  <!-- Compound Growth Area under Curve -->
  <path d="M 60 270 
           Q 150 260, 220 220 
           T 350 120 
           Q 410 70, 445 50 
           L 445 280 
           L 60 280 Z" 
        fill="url(#cig-chart-area)"/>

  <!-- Main Exponential Curve -->
  <path d="M 60 270 
           Q 150 260, 220 220 
           T 350 120 
           Q 410 70, 445 50" 
        fill="none" 
        stroke="url(#cig-stroke)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#cig-shadow)"/>

  <!-- Milestone Nodes along the curve -->
  <circle cx="60" cy="270" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="160" cy="245" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="260" cy="190" r="6" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="350" cy="120" r="7" fill="#059669" stroke="#ffffff" stroke-width="3"/>
  <circle cx="445" cy="50" r="9" fill="#10b981" stroke="#ffffff" stroke-width="3.5" filter="url(#cig-shadow)"/>

  <!-- Floating Yield Badge at peak (+11% E.A.) -->
  <g transform="translate(340, 25)" filter="url(#cig-card-shadow)">
    <rect width="125" height="38" rx="12" fill="#0f172a"/>
    <circle cx="18" cy="19" r="6" fill="#10b981"/>
    <text x="32" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">
      +11.0% E.A.
    </text>
  </g>

  <!-- Floating Daily Interest Badge (+Interés Compuesto) -->
  <g transform="translate(60, 115)" filter="url(#cig-card-shadow)">
    <rect width="145" height="42" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="11" fill="#ecfdf5"/>
    <path d="M18 21 L21 24 L26 18" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="19" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11">
      Interés Compuesto
    </text>
    <text x="40" y="32" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10">
      Reinversión Diaria
    </text>
  </g>

  <!-- Shiny Golden Floating Coins -->
  <!-- Coin 1 -->
  <g transform="translate(425, 145)">
    <ellipse cx="14" cy="18" rx="14" ry="7" fill="url(#cig-coin-edge)"/>
    <ellipse cx="14" cy="14" rx="14" ry="7" fill="url(#cig-coin-grad)" stroke="#fef3c7" stroke-width="1"/>
    <text x="14" y="17" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">$</text>
  </g>
  <!-- Coin 2 (stacked) -->
  <g transform="translate(425, 134)">
    <ellipse cx="14" cy="18" rx="14" ry="7" fill="url(#cig-coin-edge)"/>
    <ellipse cx="14" cy="14" rx="14" ry="7" fill="url(#cig-coin-grad)" stroke="#fef3c7" stroke-width="1"/>
    <text x="14" y="17" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">$</text>
  </g>
  <!-- Coin 3 (top) -->
  <g transform="translate(425, 123)">
    <ellipse cx="14" cy="18" rx="14" ry="7" fill="url(#cig-coin-edge)"/>
    <ellipse cx="14" cy="14" rx="14" ry="7" fill="url(#cig-coin-grad)" stroke="#fef3c7" stroke-width="1"/>
    <text x="14" y="17" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">$</text>
  </g>

  <!-- Base Baseline with Months Indicators -->
  <line x1="50" y1="280" x2="465" y2="280" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Mes 1</text>
  <text x="159" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Mes 3</text>
  <text x="224" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Mes 6</text>
  <text x="289" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Mes 9</text>
  <text x="354" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Mes 12</text>
  <text x="419" y="302" fill="#059669" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle">Año 2+</text>

  <!-- Sparkle Stars -->
  <path d="M465 35 L467 42 L474 44 L467 46 L465 53 L463 46 L456 44 L463 42 Z" fill="#34d399"/>
  <path d="M320 85 L321 89 L325 90 L321 91 L320 95 L319 91 L315 90 L319 89 Z" fill="#38bdf8"/>
  <path d="M75 185 L76 188 L79 189 L76 190 L75 193 L74 190 L71 189 L74 188 Z" fill="#fbbf24"/>
</svg>
