<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" class="w-full h-auto">
  <defs>
    <radialGradient id="scr-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="scr-podium-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="scr-podium-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="scr-podium-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="scr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="scr-trophy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ca8a04" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <rect x="20" y="20" width="480" height="340" rx="32" fill="url(#scr-glow)"/>

  <!-- Card Backdrop Frame -->
  <rect x="30" y="30" width="460" height="320" rx="28" fill="#ffffff" fill-opacity="0.92" stroke="#e2e8f0" stroke-width="1.5" filter="url(#scr-shadow)"/>

  <!-- Background Decorative Ranking Grid -->
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6">
    <line x1="60" y1="90" x2="460" y2="90"/>
    <line x1="60" y1="160" x2="460" y2="160"/>
    <line x1="60" y1="230" x2="460" y2="230"/>
  </g>

  <!-- Podium Pedestals -->
  <!-- 2nd Place (Left) -->
  <g transform="translate(100, 160)" filter="url(#scr-shadow)">
    <rect width="90" height="110" rx="14" fill="url(#scr-podium-2)"/>
    <text x="45" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">2</text>
    <rect x="12" y="60" width="66" height="26" rx="8" fill="#ffffff" fill-opacity="0.2"/>
    <text x="45" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">10.5% E.A.</text>
  </g>

  <!-- 1st Place (Center - Highest) -->
  <g transform="translate(210, 120)" filter="url(#scr-shadow)">
    <rect width="100" height="150" rx="16" fill="url(#scr-podium-1)"/>
    <text x="50" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">1</text>
    <rect x="14" y="75" width="72" height="30" rx="8" fill="#ffffff" fill-opacity="0.25"/>
    <text x="50" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">11.0% E.A.</text>
    <text x="50" y="130" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle">LÍDER 2026</text>
  </g>

  <!-- 3rd Place (Right) -->
  <g transform="translate(330, 185)" filter="url(#scr-shadow)">
    <rect width="90" height="85" rx="14" fill="url(#scr-podium-3)"/>
    <text x="45" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">3</text>
    <rect x="12" y="50" width="66" height="24" rx="8" fill="#ffffff" fill-opacity="0.15"/>
    <text x="45" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle">10.0% E.A.</text>
  </g>

  <!-- Golden Champion Trophy hovering above 1st place -->
  <g transform="translate(260, 80)" filter="url(#scr-trophy-shadow)">
    <!-- Trophy Cup -->
    <path d="M -18 -32 L 18 -32 C 18 -10, 12 5, 0 10 C -12 5, -18 -10, -18 -32 Z" fill="url(#scr-gold)" stroke="#fef3c7" stroke-width="1.5"/>
    <!-- Trophy Handles -->
    <path d="M -18 -26 C -28 -26, -28 -14, -14 -12" fill="none" stroke="url(#scr-gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 18 -26 C 28 -26, 28 -14, 14 -12" fill="none" stroke="url(#scr-gold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Trophy Base -->
    <rect x="-8" y="10" width="16" height="8" rx="2" fill="#d97706"/>
    <rect x="-14" y="18" width="28" height="6" rx="2" fill="#92400e"/>
    <circle cx="0" cy="-14" r="5" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- Ground Shadow Line -->
  <line x1="60" y1="270" x2="460" y2="270" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Floating Badge: "Comparativa Inteligente 2026" -->
  <g transform="translate(130, 45)" filter="url(#scr-shadow)">
    <rect width="260" height="38" rx="14" fill="#0f172a"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="35" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="0.5">
      COMPARATIVA OFICIAL DE BANCOS
    </text>
  </g>

  <!-- Floating Sparkline Banner (Top Left) -->
  <g transform="translate(50, 95)" filter="url(#scr-shadow)">
    <rect width="120" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 12 25 L 28 20 L 44 24 L 60 15 L 76 18 L 92 10" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <text x="12" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="9">Rentabilidad Máxima</text>
  </g>

  <!-- Floating Star Badge (Top Right) -->
  <g transform="translate(360, 95)" filter="url(#scr-shadow)">
    <rect width="110" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="27" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="16">⭐</text>
    <text x="42" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="11">Vigiladas</text>
    <text x="42" y="32" fill="#059669" font-family="system-ui, sans-serif" font-weight="700" font-size="9">Superfinanciera</text>
  </g>

  <!-- Sparkles -->
  <path d="M220 50 L222 55 L227 57 L222 59 L220 64 L218 59 L213 57 L218 55 Z" fill="#fde047"/>
  <path d="M300 50 L302 55 L307 57 L302 59 L300 64 L298 59 L293 57 L298 55 Z" fill="#34d399"/>
</svg>
