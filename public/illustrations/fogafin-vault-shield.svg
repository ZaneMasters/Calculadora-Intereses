<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none" class="w-full h-auto">
  <defs>
    <radialGradient id="fvs-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fvs-shield-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="fvs-shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fvs-emerald-emblem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fvs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="fvs-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#059669" flood-opacity="0.28"/>
    </filter>
    <filter id="fvs-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <rect x="20" y="20" width="480" height="340" rx="32" fill="url(#fvs-glow)"/>

  <!-- Card Backdrop Frame -->
  <rect x="30" y="30" width="460" height="320" rx="28" fill="#ffffff" fill-opacity="0.88" stroke="#e2e8f0" stroke-width="1.5" filter="url(#fvs-shadow)"/>

  <!-- Concentric Security Radar Rings in background -->
  <circle cx="260" cy="180" r="140" stroke="#0284c7" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="260" cy="180" r="110" stroke="#059669" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="260" cy="180" r="80" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Main Shield Body -->
  <g filter="url(#fvs-glow-filter)">
    <!-- Outer Shield Border -->
    <path d="M 260 65 
             C 335 65, 375 90, 375 145 
             C 375 225, 295 270, 260 295 
             C 225 270, 145 225, 145 145 
             C 145 90, 185 65, 260 65 Z" 
          fill="url(#fvs-shield-border)"/>

    <!-- Inner Shield Surface -->
    <path d="M 260 72 
             C 328 72, 365 95, 365 145 
             C 365 218, 290 260, 260 283 
             C 230 260, 155 218, 155 145 
             C 155 95, 192 72, 260 72 Z" 
          fill="url(#fvs-shield-metal)"/>
  </g>

  <!-- Shield Texture / Highlights -->
  <path d="M 260 78 
           C 320 78, 355 98, 355 145 
           C 355 180, 335 215, 305 240 
           L 260 145 Z" 
        fill="#ffffff" 
        fill-opacity="0.05"/>

  <!-- Bank Vault Safe Lock Wheel in Center -->
  <circle cx="260" cy="165" r="50" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="260" cy="165" r="42" fill="url(#fvs-emerald-emblem)" stroke="#34d399" stroke-width="2"/>

  <!-- Vault Handles / Spokes -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <line x1="260" y1="128" x2="260" y2="136"/>
    <line x1="260" y1="194" x2="260" y2="202"/>
    <line x1="223" y1="165" x2="231" y2="165"/>
    <line x1="289" y1="165" x2="297" y2="165"/>
    <line x1="234" y1="139" x2="240" y2="145"/>
    <line x1="280" y1="185" x2="286" y2="191"/>
    <line x1="234" y1="191" x2="240" y2="185"/>
    <line x1="280" y1="145" x2="286" y2="139"/>
  </g>

  <!-- Large Solid Checkmark in Center -->
  <path d="M 246 166 L 256 176 L 276 154" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Top Floating Badge: "Superfinanciera Vigilado" -->
  <g transform="translate(60, 75)" filter="url(#fvs-shadow)">
    <rect width="135" height="42" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="10" fill="#eff6ff"/>
    <path d="M16 21 L19 24 L25 18" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5">
      Superfinanciera
    </text>
    <text x="36" y="32" fill="#2563eb" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5">
      Entidad Vigilada
    </text>
  </g>

  <!-- Main Bottom Banner: "Seguro Fogafín $50.000.000 COP" -->
  <g transform="translate(130, 275)" filter="url(#fvs-glow-filter)">
    <rect width="260" height="52" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="28" cy="26" r="14" fill="url(#fvs-gold)"/>
    <text x="28" y="32" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">🛡️</text>
    <text x="52" y="23" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">
      SEGURO DE DEPÓSITOS FOGAFÍN
    </text>
    <text x="52" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="15">
      Hasta $50.000.000 COP
    </text>
  </g>

  <!-- Floating Right Badge: "Protección 100%" -->
  <g transform="translate(345, 95)" filter="url(#fvs-shadow)">
    <rect width="125" height="40" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="10" fill="#ecfdf5"/>
    <text x="20" y="24" fill="#059669" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">✓</text>
    <text x="36" y="18" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5">
      Por Titular
    </text>
    <text x="36" y="31" fill="#059669" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5">
      Sin Costo Adicional
    </text>
  </g>

  <!-- Floating Gold Coins Near Base -->
  <g transform="translate(100, 220)">
    <ellipse cx="14" cy="18" rx="12" ry="6" fill="#b45309"/>
    <ellipse cx="14" cy="14" rx="12" ry="6" fill="url(#fvs-gold)" stroke="#fef3c7" stroke-width="1"/>
    <text x="14" y="17" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="9" text-anchor="middle">$</text>
  </g>
  <g transform="translate(390, 210)">
    <ellipse cx="14" cy="18" rx="12" ry="6" fill="#b45309"/>
    <ellipse cx="14" cy="14" rx="12" ry="6" fill="url(#fvs-gold)" stroke="#fef3c7" stroke-width="1"/>
    <text x="14" y="17" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="9" text-anchor="middle">$</text>
  </g>

  <!-- Sparkles -->
  <path d="M125 150 L127 155 L132 157 L127 159 L125 164 L123 159 L118 157 L123 155 Z" fill="#38bdf8"/>
  <path d="M405 160 L407 165 L412 167 L407 169 L405 174 L403 169 L398 167 L403 165 Z" fill="#34d399"/>
</svg>
